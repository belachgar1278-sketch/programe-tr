<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>تعديل التردد والمدة الزمنية</title>
    <style>
        body {
            font-family: Tahoma, sans-serif;
            background-color: #f4f6f9;
            margin: 20px;
        }
        .line-header {
            background-color: #e9ecef;
            padding: 12px 15px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: bold;
            font-size: 14px;
            color: #333;
            border: 1px solid #ddd;
        }
        .info-badge {
            background: #fff;
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 13px;
        }
        .edit-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
            margin-right: auto;
        }
        .edit-btn:hover {
            background-color: #0056b3;
        }
        /* تصميم النافذة المنبثقة Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
        }
        .modal-content {
            background-color: #fff;
            margin: 15% auto;
            padding: 20px;
            border-radius: 8px;
            width: 300px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        .modal-content h3 {
            margin-top: 0;
            font-size: 16px;
            color: #333;
        }
        .modal-content label {
            display: block;
            margin-top: 10px;
            font-size: 13px;
        }
        .modal-content input {
            width: 100%;
            padding: 6px;
            margin-top: 5px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        .modal-actions {
            margin-top: 15px;
            text-align: left;
        }
        .modal-actions button {
            padding: 6px 12px;
            cursor: pointer;
            border: none;
            border-radius: 4px;
        }
        .btn-save {
            background-color: #28a745;
            color: white;
        }
        .btn-cancel {
            background-color: #6c757d;
            color: white;
            margin-left: 5px;
        }
    </style>
</head>
<body>

    <!-- الجزء الخاص بعنوان الخط والبيانات كما في الصورة -->
    <div class="line-header">
        <span>الخط: 01 برحيل (12 حافلات)</span>
        <span class="info-badge">التردد: <span id="freq-val">15</span> دقيقة</span>
        <span class="info-badge">المدة الزمنية: <span id="dur-val">90</span> دقيقة</span>
        
        <!-- زر التعديل -->
        <button class="edit-btn" onclick="openEditModal()">✏️ تعديل</button>
    </div>

    <!-- النافذة المنبثقة للتعديل (Modal) -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <h3>تعديل التردد والمدة الزمنية</h3>
            
            <label for="editFrequency">التردد (بالدقائق):</label>
            <input type="number" id="editFrequency">

            <label for="editDuration">المدة الزمنية (بالدقائق):</label>
            <input type="number" id="editDuration">

            <div class="modal-actions">
                <button class="btn-save" onclick="saveChanges()">حفظ</button>
                <button class="btn-cancel" onclick="closeEditModal()">إلغاء</button>
            </div>
        </div>
    </div>

    <script>
        // فتح النافذة وجلب القِيَم الحالية لعرضها في حقول الإدخال
        function openEditModal() {
            const currentFreq = document.getElementById('freq-val').innerText;
            const currentDur = document.getElementById('dur-val').innerText;

            document.getElementById('editFrequency').value = currentFreq;
            document.getElementById('editDuration').value = currentDur;

            document.getElementById('editModal').style.display = 'block';
        }

        // إغلاق النافذة
        function closeEditModal() {
            document.getElementById('editModal').style.display = 'none';
        }

        // حفظ التغييرات وتحديث الواجهة
        function saveChanges() {
            const newFreq = document.getElementById('editFrequency').value;
            const newDur = document.getElementById('editDuration').value;

            // تحديث القيم ظاهرياً في الصفحة
            document.getElementById('freq-val').innerText = newFreq;
            document.getElementById('dur-val').innerText = newDur;

            // ملاحظة: يمكنك هنا ربط الكود بقاعدة البيانات عبر دالة Fetch/AJAX لحفظ البيانات في السيرفر

            closeEditModal();
        }

        // إغلاق النافذة عند النقر في أي مكان خارجها
        window.onclick = function(event) {
            const modal = document.getElementById('editModal');
            if (event.target == modal) {
                closeEditModal();
            }
        }
    </script>

</body>
</html>
